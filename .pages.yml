media:
  input: assets/images
  output: /assets/images
  rename: safe
  categories: [image]

content:

  # ==================================================
  # ΕΛΛΗΝΙΚΑ ΑΡΘΡΑ
  # ==================================================

  - name: greek_posts
    label: Ελληνικά άρθρα
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{date}-{title}.md"

    view:
      primary: title
      fields: [title, date, category]
      sort: [date, title]
      search: [title, category, author]
      default:
        sort: date
        order: desc

    fields:

      - name: title
        label: Τίτλος
        type: string
        required: true

      - name: date
        label: Ημερομηνία δημοσίευσης
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: category
        label: Κατηγορία
        type: select
        required: true
        options:
          placeholder: Επίλεξε κατηγορία
          values:
            - Υγεία
            - Διατροφή
            - Εξετάσεις
            - Fact-Checking
            - Έρευνα

      - name: translation_key
        label: Κωδικός μετάφρασης
        type: string

      - name: image
        label: Εικόνα εξωφύλλου
        type: image
        options:
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe

      - name: excerpt
        label: Σύντομη περιγραφή
        type: text

      - name: author
        label: Συγγραφέας
        type: string

      - name: featured
        label: Κεντρικό άρθρο
        type: boolean

      - name: seo_title
        label: SEO Title
        type: string

      - name: seo_description
        label: SEO Description
        type: text


      # ==================================================
      # ΜΕ ΜΙΑ ΜΑΤΙΑ
      # Για Υγεία / Διατροφή / Εξετάσεις / Έρευνα
      # ==================================================

      - name: overview
        label: Με μια ματιά
        type: text
        description: "Γράψε μια σύντομη παράγραφο που συνοψίζει τα σημαντικότερα σημεία του άρθρου. Άφησέ το κενό στα άρθρα Fact-Checking."


      # ==================================================
      # FACT-CHECKING PANEL
      # Συμπληρώνεται μόνο σε άρθρα κατηγορίας Fact-Checking
      # ==================================================

      - name: fact_checks
        label: "Fact-Checking: Ισχυρισμοί"
        type: object
        description: "Συμπλήρωσέ το μόνο όταν η κατηγορία του άρθρου είναι Fact-Checking. Πρόσθεσε έναν ή περισσότερους ισχυρισμούς."
        list:
          collapsible:
            collapsed: true
            summary: "Ισχυρισμός {index}: {claim}"
        fields:

          - name: claim
            label: Εξεταζόμενος ισχυρισμός
            type: text
            required: true
            description: "Γράψε ακριβώς τον ισχυρισμό που εξετάζεις."

          - name: verdict
            label: Αξιολόγηση
            type: select
            required: true
            options:
              placeholder: Επίλεξε αξιολόγηση
              values:
                - Ακριβές
                - Μερικώς ακριβές
                - Παραπλανητικό
                - Ανακριβές
                - Πολύ ανακριβές

          - name: conclusion
            label: Τι ισχύει / Συμπέρασμα
            type: text
            required: true
            description: "Σύντομη αλλά ολοκληρωμένη εξήγηση του τι δείχνουν τα επιστημονικά δεδομένα για τον συγκεκριμένο ισχυρισμό."


      # ==================================================
      # ΚΥΡΙΩΣ ΑΡΘΡΟ
      # ==================================================

      - name: body
        label: Κείμενο άρθρου
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe


      # ==================================================
      # ΣΥΧΝΕΣ ΕΡΩΤΗΣΕΙΣ
      # ==================================================

      - name: faqs
        label: Συχνές Ερωτήσεις
        type: object
        description: "Πρόσθεσε πραγματικές ερωτήσεις που απαντώνται σύντομα και τεκμηριωμένα. Συνήθως 3–5 είναι αρκετές. Άφησέ το κενό αν δεν χρειάζεται."
        list:
          collapsible:
            collapsed: true
            summary: "Ερώτηση {index}: {question}"
        fields:

          - name: question
            label: Ερώτηση
            type: string
            required: true

          - name: answer
            label: Απάντηση
            type: text
            required: true


      # ==================================================
      # ΠΗΓΕΣ
      # ==================================================

      - name: sources
        label: Πηγές
        type: object
        description: "Πρόσθεσε τις πηγές με τη σειρά που παραπέμπεις σε αυτές μέσα στο άρθρο ως [1], [2], [3] κ.ο.κ."
        list:
          collapsible:
            collapsed: true
            summary: "Πηγή {index}: {reference}"
        fields:

          - name: reference
            label: Αναφορά πηγής
            type: text
            required: true
            description: "Γράψε την αναφορά όπως θέλεις να εμφανίζεται στο τέλος του άρθρου."

          - name: url
            label: Link πηγής
            type: string
            required: true
            description: "Βάλε ολόκληρο το URL της πηγής, π.χ. https://..."


  # ==================================================
  # ENGLISH ARTICLES
  # ==================================================

  - name: english_posts
    label: English articles
    type: collection
    path: en/_posts
    format: yaml-frontmatter
    filename: "{date}-{title}.md"

    view:
      primary: title
      fields: [title, date, category]
      sort: [date, title]
      search: [title, category, author]
      default:
        sort: date
        order: desc

    fields:

      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: category
        label: Category
        type: select
        required: true
        options:
          placeholder: Select category
          values:
            - Health
            - Nutrition
            - Lab Tests
            - Fact-Checking
            - Research

      - name: translation_key
        label: Translation key
        type: string

      - name: image
        label: Cover image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe

      - name: excerpt
        label: Short description
        type: text

      - name: author
        label: Author
        type: string

      - name: featured
        label: Featured article
        type: boolean

      - name: seo_title
        label: SEO Title
        type: string

      - name: seo_description
        label: SEO Description
        type: text


      # ==================================================
      # AT A GLANCE
      # For Health / Nutrition / Lab Tests / Research
      # ==================================================

      - name: overview
        label: At a glance
        type: text
        description: "Write a short paragraph summarising the key points of the article. Leave this empty for Fact-Checking articles."


      # ==================================================
      # FACT-CHECKING PANEL
      # Complete only for Fact-Checking articles
      # ==================================================

      - name: fact_checks
        label: "Fact-Checking: Claims"
        type: object
        description: "Complete this section only when the article category is Fact-Checking. Add one or more claims."
        list:
          collapsible:
            collapsed: true
            summary: "Claim {index}: {claim}"
        fields:

          - name: claim
            label: Claim being examined
            type: text
            required: true
            description: "Enter the exact claim being evaluated."

          - name: verdict
            label: Rating
            type: select
            required: true
            options:
              placeholder: Select rating
              values:
                - Accurate
                - Partly accurate
                - Misleading
                - Inaccurate
                - Highly inaccurate

          - name: conclusion
            label: What the evidence shows / Conclusion
            type: text
            required: true
            description: "Provide a concise but complete explanation of what the scientific evidence shows about this claim."


      # ==================================================
      # ARTICLE CONTENT
      # ==================================================

      - name: body
        label: Article content
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe


      # ==================================================
      # FREQUENTLY ASKED QUESTIONS
      # ==================================================

      - name: faqs
        label: Frequently Asked Questions
        type: object
        description: "Add genuine questions that can be answered clearly and concisely. Usually 3–5 questions are enough. Leave this empty if not needed."
        list:
          collapsible:
            collapsed: true
            summary: "Question {index}: {question}"
        fields:

          - name: question
            label: Question
            type: string
            required: true

          - name: answer
            label: Answer
            type: text
            required: true


      # ==================================================
      # SOURCES
      # ==================================================

      - name: sources
        label: Sources
        type: object
        description: "Add the sources in the same order in which you cite them in the article as [1], [2], [3], etc."
        list:
          collapsible:
            collapsed: true
            summary: "Source {index}: {reference}"
        fields:

          - name: reference
            label: Source reference
            type: text
            required: true
            description: "Enter the reference exactly as you want it to appear at the end of the article."

          - name: url
            label: Source link
            type: string
            required: true
            description: "Enter the full source URL, e.g. https://..."
