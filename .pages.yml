media:
  input: assets/images
  output: /BiomedFacts/assets/images
  rename: safe
  categories: [image]

content:

  - name: posts
    label: Άρθρα
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"

    view:
      primary: title
      fields: [title, date, category]
      sort: [date, title]
      search: [title, category, author]
      default:
        sort: date
        order: desc

    fields:

      - name: title
        label: Τίτλος
        type: string
        required: true

      - name: date
        label: Ημερομηνία δημοσίευσης
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: category
        label: Κατηγορία
        type: select
        required: true
        options:
          placeholder: Επίλεξε κατηγορία
          values:
            - Υγεία
            - Διατροφή
            - Γυναικεία Υγεία
            - Εξετάσεις
            - Fact-Checking
            - Νέα
            - Έρευνα

      - name: image
        label: Εικόνα εξωφύλλου
        type: image
        description: Η βασική εικόνα που θα εμφανίζεται στην αρχική και στην κορυφή του άρθρου.
        options:
          path: assets/images
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe

      - name: excerpt
        label: Σύντομη περιγραφή
        type: text
        description: Γράψε 1–2 προτάσεις που θα εμφανίζονται κάτω από τον τίτλο στην αρχική.

      - name: author
        label: Συγγραφέας
        type: string

      - name: featured
        label: Κεντρικό άρθρο
        type: boolean

      - name: seo_title
        label: SEO Title
        type: string
        description: Ο τίτλος που θα χρησιμοποιείται για τις μηχανές αναζήτησης.

      - name: seo_description
        label: SEO Description
        type: text
        description: Σύντομη περιγραφή του άρθρου για Google και άλλες μηχανές αναζήτησης.

      - name: body
        label: Κείμενο άρθρου
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          path: assets/images
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe