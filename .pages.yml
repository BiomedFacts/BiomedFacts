media:
  input: assets/images
  output: /assets/images
  rename: safe
  categories: [image]

content:

  # ==================================================
  # ΕΛΛΗΝΙΚΑ ΑΡΘΡΑ
  # ==================================================

  - name: greek_posts
    label: Ελληνικά άρθρα
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{date}-{title}.md"

    view:
      primary: title
      fields: [title, date, category]
      sort: [date, title]
      search: [title, category, author]
      default:
        sort: date
        order: desc

    fields:

      - name: title
        label: Τίτλος
        type: string
        required: true

      - name: date
        label: Ημερομηνία δημοσίευσης
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: category
        label: Κατηγορία
        type: select
        required: true
        options:
          placeholder: Επίλεξε κατηγορία
          values:
            - Υγεία
            - Διατροφή
            - Εξετάσεις
            - Fact-Checking
            - Έρευνα

      - name: translation_key
        label: Κωδικός μετάφρασης
        type: string

      - name: image
        label: Εικόνα εξωφύλλου
        type: image
        options:
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe

      - name: excerpt
        label: Σύντομη περιγραφή
        type: text

      - name: author
        label: Συγγραφέας
        type: string

      - name: featured
        label: Κεντρικό άρθρο
        type: boolean

      - name: seo_title
        label: SEO Title
        type: string

      - name: seo_description
        label: SEO Description
        type: text

      # ==================================================
      # FACT-CHECKING PANEL
      # Συμπληρώνεται μόνο σε άρθρα κατηγορίας Fact-Checking
      # ==================================================

      - name: fact_checks
        label: "Fact-Checking: Ισχυρισμοί"
        type: object
        description: "Συμπλήρωσέ το μόνο όταν η κατηγορία του άρθρου είναι Fact-Checking. Πρόσθεσε έναν ή περισσότερους ισχυρισμούς."
        list:
          collapsible:
            collapsed: true
            summary: "Ισχυρισμός {index}: {claim}"
        fields:

          - name: claim
            label: Εξεταζόμενος ισχυρισμός
            type: text
            required: true
            description: "Γράψε ακριβώς τον ισχυρισμό που εξετάζεις."

          - name: verdict
            label: Αξιολόγηση
            type: select
            required: true
            options:
              placeholder: Επίλεξε αξιολόγηση
              values:
                - Ακριβές
                - Μερικώς ακριβές
                - Παραπλανητικό
                - Ανακριβές
                - Πολύ ανακριβές

          - name: conclusion
            label: Τι ισχύει / Συμπέρασμα
            type: text
            required: true
            description: "Σύντομη αλλά ολοκληρωμένη εξήγηση του τι δείχνουν τα επιστημονικά δεδομένα για τον συγκεκριμένο ισχυρισμό."

      - name: body
        label: Κείμενο άρθρου
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe


  # ==================================================
  # ENGLISH ARTICLES
  # ==================================================

  - name: english_posts
    label: English articles
    type: collection
    path: en/_posts
    format: yaml-frontmatter
    filename: "{date}-{title}.md"

    view:
      primary: title
      fields: [title, date, category]
      sort: [date, title]
      search: [title, category, author]
      default:
        sort: date
        order: desc

    fields:

      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: category
        label: Category
        type: select
        required: true
        options:
          placeholder: Select category
          values:
            - Health
            - Nutrition
            - Lab Tests
            - Fact-Checking
            - Research

      - name: translation_key
        label: Translation key
        type: string

      - name: image
        label: Cover image
        type: image
        options:
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe

      - name: excerpt
        label: Short description
        type: text

      - name: author
        label: Author
        type: string

      - name: featured
        label: Featured article
        type: boolean

      - name: seo_title
        label: SEO Title
        type: string

      - name: seo_description
        label: SEO Description
        type: text

      # ==================================================
      # FACT-CHECKING PANEL
      # Complete only for Fact-Checking articles
      # ==================================================

      - name: fact_checks
        label: "Fact-Checking: Claims"
        type: object
        description: "Complete this section only when the article category is Fact-Checking. Add one or more claims."
        list:
          collapsible:
            collapsed: true
            summary: "Claim {index}: {claim}"
        fields:

          - name: claim
            label: Claim being examined
            type: text
            required: true
            description: "Enter the exact claim being evaluated."

          - name: verdict
            label: Rating
            type: select
            required: true
            options:
              placeholder: Select rating
              values:
                - Accurate
                - Partly accurate
                - Misleading
                - Inaccurate
                - Highly inaccurate

          - name: conclusion
            label: What the evidence shows / Conclusion
            type: text
            required: true
            description: "Provide a concise but complete explanation of what the scientific evidence shows about this claim."

      - name: body
        label: Article content
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe
