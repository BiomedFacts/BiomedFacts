media:
  input: assets/images
  output: /assets/images

content:

  - name: posts
    label: Άρθρα
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"

    view:
      primary: title
      fields: [title, date, category]
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:

      - name: title
        label: Τίτλος
        type: string
        required: true

      - name: date
        label: Ημερομηνία δημοσίευσης
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: category
        label: Κατηγορία
        type: select
        required: true
        options:
          placeholder: Επίλεξε κατηγορία
          values:
            - Υγεία
            - Διατροφή
            - Γυναικεία Υγεία
            - Εξετάσεις
            - Fact-Checking
            - Νέα
            - Έρευνα

      - name: image
        label: Εικόνα εξωφύλλου
        type: image
        required: false

      - name: excerpt
        label: Σύντομη περιγραφή
        type: text
        description: Μικρή περίληψη που θα εμφανίζεται στην αρχική σελίδα.

      - name: author
        label: Συγγραφέας
        type: string

      - name: featured
        label: Κεντρικό άρθρο
        type: boolean

      - name: seo_title
        label: SEO Title
        type: string

      - name: seo_description
        label: SEO Description
        type: text

      - name: body
        label: Κείμενο άρθρου
        type: rich-text
        required: true
        options:
          format: markdown
          extensions:
            - jpg
            - jpeg
            - png
            - webp