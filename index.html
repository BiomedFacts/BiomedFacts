<!DOCTYPE html>
<html lang="el">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BiomedFacts | Επιστήμη χωρίς παραπληροφόρηση</title>

  <meta
    name="description"
    content="Evidence-based ενημέρωση για υγεία, βιοϊατρική επιστήμη, διατροφή και fact-checking."
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #111;
      line-height: 1.6;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 28px 6%;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }

    .logo {
      font-family: "Times New Roman", serif;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: -1px;
    }

    .logo span {
      color: #6c3bb8;
    }

    .tagline {
      font-size: 14px;
      color: #666;
    }

    nav {
      margin-top: 25px;
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      border-top: 1px solid #eee;
      padding-top: 18px;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
    }

    nav a:hover {
      color: #6c3bb8;
    }

    main {
      width: min(1200px, 88%);
      margin: 50px auto;
      min-height: 300px;
    }

    .newsletter {
      margin-top: 60px;
      background: #111;
      color: white;
      text-align: center;
      padding: 60px 25px;
    }

    .newsletter h2 {
      font-family: "Times New Roman", serif;
      font-size: 38px;
      margin-bottom: 12px;
    }

    footer {
      margin-top: 60px;
      border-top: 1px solid #ddd;
      text-align: center;
      padding: 35px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 800px) {

      .top {
        flex-direction: column;
        align-items: flex-start;
      }

      .logo {
        font-size: 34px;
      }

      nav {
        gap: 14px;
      }

    }

  </style>
</head>

<body>

<header>

  <div class="top">

    <div>

      <div class="logo">
        Biomed<span>Facts</span>
      </div>

      <div class="tagline">
        Evidence-based health & biomedical science
      </div>

    </div>

  </div>

  <nav>
    <a href="#">Αρχική</a>
    <a href="#">Υγεία</a>
    <a href="#">Διατροφή</a>
    <a href="#">Γυναικεία Υγεία</a>
    <a href="#">Βιοϊατρική</a>
    <a href="#">Fact Check</a>
    <a href="#">Νέα</a>
    <a href="#">Έρευνα</a>
  </nav>

</header>


<main>

  <!-- Εδώ θα εμφανίζονται αργότερα αυτόματα τα άρθρα σου -->

  <section class="newsletter">

    <h2>Science, without the noise.</h2>

    <p>
      Νέα, fact-checking και evidence-based ενημέρωση.
    </p>

  </section>

</main>


<footer>
  © 2026 BiomedFacts · Evidence-based science communication
</footer>

</body>

</html>
